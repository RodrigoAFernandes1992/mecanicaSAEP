<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="nome" />
    <input type="text" id="senha" />
    <button type="button" id="enviar">Entrar</button>
    <a href="./cadastro.html">Cadastrar</a>
    <script>
      const api = "http://localhost:3000";
      document.querySelector("#enviar").addEventListener("click", async () => {
        const datas = {
          user: document.querySelector("#nome").value,
          password: document.querySelector("#senha").value,
        };
        const resposta = await fetch(`${api}/login`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(datas),
        });
        const confirma = await resposta.json();
        if (resposta.status == 200) {
          if (confirma.nivel == 1) {
            localStorage.setItem('id', confirma.id_cliente)
            localStorage.setItem('nome', confirma.nome)
            return window.location.href = "./index.html";
          }
          localStorage.setItem('id', confirma.id_cliente)
          localStorage.setItem('nome', confirma.nome)
          return (window.location.href = "./paguser.html");
        }
        alert("Erro ao logar");
      });
    </script>
  </body>
</html>
